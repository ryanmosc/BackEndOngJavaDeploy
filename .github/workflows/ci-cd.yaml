name: CI/CD Backend ONG v2

on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / verificacao codigo
        uses: actions/checkout@v4

      - name: Login No DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name:  Build e Push da imagem para o docker DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ryanmosc/backend-ong:latest
            ryanmosc/backend-ong:${{ github.sha }}

      - name: Deploy na vps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "cheguei na vps e partindo para o deploy"
            cd /opt/backend
            docker compose down 
            docker compose pull
            docker compose up -d
            
